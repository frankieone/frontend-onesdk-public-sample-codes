buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")

        // Security: raise vulnerable build-tool libraries that AGP 8.1.1 pulls onto
        // the buildscript classpath (Wiz high/critical findings). Build-time only;
        // nothing here is packaged into the APK.
        classpath(platform("io.netty:netty-bom:4.1.137.Final"))
        classpath(platform("io.grpc:grpc-bom:1.75.0"))
        constraints {
            classpath("com.google.protobuf:protobuf-java:3.25.5")
            classpath("commons-io:commons-io:2.14.0")
            classpath("org.bitbucket.b_c:jose4j:0.9.6")
            classpath("org.jdom:jdom2:2.0.6.1")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

// Enforce JVM target 17 for all Kotlin compilations (including third-party modules
// like react-native-screens) to match the JDK used in CI.
allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = "17"
    }
}

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")

        // Security: raise vulnerable build-tool libraries that AGP 9.2.1 pulls onto
        // the buildscript classpath (Wiz high/critical findings). Build-time only;
        // nothing here is packaged into the APK. Keep a constraint only while it
        // still raises the version AGP resolves on its own (AGP 9.2.1 resolves
        // jose4j 0.9.5 and jdom2 2.0.6).
        constraints {
            classpath("org.bitbucket.b_c:jose4j:0.9.6")
            classpath("org.jdom:jdom2:2.0.6.1")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

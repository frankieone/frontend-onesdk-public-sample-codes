org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
# React Native 0.82+ only supports the New Architecture; the legacy
# architecture (newArchEnabled=false) has been removed.
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true
# Opt out of built-in Kotlin and the new DSL that ship with AGP 9
# (as the React Native 0.88 template does; removed in AGP 10).
android.builtInKotlin=false
android.newDsl=false

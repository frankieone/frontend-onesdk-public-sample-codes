apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Bundle JS into the APK for all build variants (including debug).
    // By default debuggableVariants is ["debug", "debugOptimized"], which tells
    // the Gradle plugin to skip bundling and rely on Metro instead. Setting it
    // to an empty list forces bundling so the APK works standalone (no Metro).
    debuggableVariants = []

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC), used only when
 * hermesEnabled=false in gradle.properties.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.frankieone.onesdk.rnsample"

    defaultConfig {
        applicationId "com.frankieone.onesdk.rnsample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Uses the default Android debug keystore — no custom signingConfig needed
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

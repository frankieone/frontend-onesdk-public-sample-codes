# Supply-chain cooldown: don't install versions published less than 7 days ago.
# Our own org's packages are exempt so internal releases aren't delayed.
minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@frankieone/*'
# Flat node_modules, as with npm: the Android/Gradle build resolves React Native's native plugins and autolinking
# through paths like ../node_modules/@react-native/gradle-plugin, which pnpm's default isolated layout does not provide.
nodeLinker: hoisted

name: Mobile React Native Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile-onesdk-sample-react-native/**'
      - '.github/workflows/mobile-react-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # pnpm is installed at the version pinned in package.json's packageManager field.
      # All dependencies are public, so no registry token is needed.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: mobile-onesdk-sample-react-native/package.json

      - name: Install dependencies
        run: |
          cd mobile-onesdk-sample-react-native
          pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: |
          cd mobile-onesdk-sample-react-native/android
          gradle assembleDebug

      - name: Rename APK
        run: mv mobile-onesdk-sample-react-native/android/app/build/outputs/apk/debug/app-debug.apk mobile-onesdk-sample-react-native/android/app/build/outputs/apk/debug/f1-react-native.apk

      - name: Delete old release if exists
        run: gh release delete mobile-react-native-latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old tag if exists
        run: git push origin --delete mobile-react-native-latest || true

      - name: Create GitHub Release
        run: |
          gh release create mobile-react-native-latest \
            mobile-onesdk-sample-react-native/android/app/build/outputs/apk/debug/f1-react-native.apk \
            --title "F1 RN (latest)" \
            --notes "Debug APK built from commit ${{ github.sha }}. Install on any Android device (enable Unknown Sources)." \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

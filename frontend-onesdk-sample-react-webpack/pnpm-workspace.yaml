# Supply-chain cooldown: don't install versions published less than 7 days ago.
# Our own org's packages are exempt so internal releases aren't delayed.
minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@frankieone/*'
# Keep in step with "overrides" in package.json: npm ignores this file, and customers who copy this sample
# and run `npm install` rely on package.json's copy.
overrides:
  'react-scripts>typescript': '^5'
  'react-scripts>node-forge': '^1.4.2'
  '@frankieone/one-sdk@1.7.6>axios': '^0.34.0'
# Build scripts: none are needed; every package below ships prebuilt binaries or only prints a banner.
allowBuilds:
  'core-js': false
  'core-js-pure': false
  'es5-ext': false
